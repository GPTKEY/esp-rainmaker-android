name: Provisioning Full UI Notice Capture

on:
  push:
    branches:
      - codex/existing-wifi-reuse-first-pairing
    paths:
      - "scripts/implement_provisioning_ui_notice_capture.py"
      - ".github/workflows/05_provisioning_ui_notice_capture.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provisioning-full-ui-notice-capture
  cancel-in-progress: true

jobs:
  implement-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/existing-wifi-reuse-first-pairing
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Apply UI notice capture
        shell: bash
        run: |
          python3 -m py_compile scripts/implement_provisioning_ui_notice_capture.py
          python3 scripts/implement_provisioning_ui_notice_capture.py
          grep -R "ProvisioningToast.makeText" -n app/src/main/java/com/espressif/ui/activities || true
          grep -R "ProvisioningAlertDialogBuilder" -n app/src/main/java/com/espressif/ui/activities app/src/main/java/com/espressif/utils/ExistingWifiReuseHelper.java || true

      - name: Create CI build properties
        shell: bash
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          appName=ESP RainMaker Full Pairing Logs Test
          transport=Both
          security=2
          security2Username=wifiprov
          security2UsernameThread=threadprov
          deviceNamePrefix=PROV_
          wifiScanSource=Device
          isChinaRegion=false
          isLocalControlSupported=true
          isScheduleSupported=true
          isSceneSupported=true
          isNodeGroupingSupported=true
          isNodeSharingSupported=true
          isAutomationSupported=true
          isOtaSupported=false
          isMatterSupported=false
          isCommandResponseSupported=false
          EOF

          if [ ! -f app/google-services.json ] && [ -f app/google-services.json.template ]; then
            cp app/google-services.json.template app/google-services.json
          fi

      - name: Verify notice coverage and privacy boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          toast = Path('app/src/main/java/com/espressif/utils/ProvisioningToast.java').read_text(encoding='utf-8')
          dialog = Path('app/src/main/java/com/espressif/utils/ProvisioningAlertDialogBuilder.java').read_text(encoding='utf-8')
          log = Path('app/src/main/java/com/espressif/utils/ProvisioningLog.java').read_text(encoding='utf-8')

          assert 'ProvisioningLog.uiNotice' in toast
          assert 'return Toast.makeText' in toast
          assert 'ProvisioningLog.uiNotice("Dialog"' in dialog
          assert 'setPositiveButton' in dialog
          assert 'setNegativeButton' in dialog
          # The wrapper logs only text explicitly passed to Builder; it must never inspect dialog input widgets.
          assert 'android.widget.EditText' not in dialog
          assert 'findViewById(' not in dialog
          assert '.getText().toString()' not in dialog

          targets = [
              'BLEProvisionLanding.java',
              'ProofOfPossessionActivity.java',
              'ClaimingActivity.java',
              'WiFiScanActivity.java',
              'WiFiConfigActivity.java',
              'ProvisionActivity.java',
              'BleWifiProvisionActivity.java',
          ]
          base = Path('app/src/main/java/com/espressif/ui/activities')
          combined = '\n'.join((base / name).read_text(encoding='utf-8') for name in targets)
          assert 'ProvisioningToast.makeText(' in combined
          assert 'new ProvisioningAlertDialogBuilder(' in combined

          reuse = Path('app/src/main/java/com/espressif/utils/ExistingWifiReuseHelper.java').read_text(encoding='utf-8')
          assert 'new ProvisioningAlertDialogBuilder(' in reuse

          assert 'MAX_LINES = 3000' in log
          assert 'getSharedPreferences(' not in log
          assert 'FileOutputStream(' not in log
          assert 'password|passphrase|passwd|pwd|pop|' in log
          print('Full UI notice capture checks passed')
          PY

      - name: Build debug APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Commit product source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/java/com/espressif/utils/ProvisioningToast.java \
            app/src/main/java/com/espressif/utils/ProvisioningAlertDialogBuilder.java \
            app/src/main/java/com/espressif/ui/activities/BLEProvisionLanding.java \
            app/src/main/java/com/espressif/ui/activities/ProofOfPossessionActivity.java \
            app/src/main/java/com/espressif/ui/activities/ClaimingActivity.java \
            app/src/main/java/com/espressif/ui/activities/WiFiScanActivity.java \
            app/src/main/java/com/espressif/ui/activities/WiFiConfigActivity.java \
            app/src/main/java/com/espressif/ui/activities/ProvisionActivity.java \
            app/src/main/java/com/espressif/ui/activities/BleWifiProvisionActivity.java \
            app/src/main/java/com/espressif/utils/ExistingWifiReuseHelper.java

          if git diff --cached --quiet; then
            echo "No product source changes to commit"
          else
            git commit -m "功能：配网日志完整记录Toast和对话框通知"
            git push origin HEAD:codex/existing-wifi-reuse-first-pairing
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pairing-full-ui-notices-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
