name: Existing Wi-Fi Reuse First Pairing

on:
  push:
    branches:
      - codex/existing-wifi-reuse-first-pairing
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/02_existing_wifi_reuse_first_pairing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: existing-wifi-reuse-first-pairing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Create CI build properties
        shell: bash
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          appName=ESP RainMaker Existing WiFi Test
          transport=Both
          security=2
          security2Username=wifiprov
          security2UsernameThread=threadprov
          deviceNamePrefix=PROV_
          wifiScanSource=Device
          isChinaRegion=false
          isLocalControlSupported=true
          isScheduleSupported=true
          isSceneSupported=true
          isNodeGroupingSupported=true
          isNodeSharingSupported=true
          isAutomationSupported=true
          isOtaSupported=false
          isMatterSupported=false
          isCommandResponseSupported=false
          EOF

          if [ ! -f app/google-services.json ] && [ -f app/google-services.json.template ]; then
            cp app/google-services.json.template app/google-services.json
          fi

      - name: Verify implementation boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          provision = Path('app/src/main/java/com/espressif/ui/activities/ProvisionActivity.java').read_text(encoding='utf-8')
          helper = Path('app/src/main/java/com/espressif/utils/ExistingWifiReuseHelper.java').read_text(encoding='utf-8')
          claiming = Path('app/src/main/java/com/espressif/ui/activities/ClaimingActivity.java').read_text(encoding='utf-8')

          assert 'KEY_REUSE_CURRENT_WIFI' in provision
          assert 'continueWithExistingWifiAfterAssociation()' in provision
          assert 'prepareGetWiFiConfigStatusMsg' in helper
          assert 'WifiStationState.Connected' in helper
          assert 'response.hasWifiConnected()' in helper
          assert 'routeAfterClaimWithExistingWifiCheck' in claiming
          print('Implementation boundary checks passed')
          PY

      - name: Build debug APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: existing-wifi-reuse-first-pairing-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
