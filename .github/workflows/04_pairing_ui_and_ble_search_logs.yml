name: Pairing UI and BLE Search Logs

on:
  push:
    branches:
      - codex/existing-wifi-reuse-first-pairing
    paths:
      - "scripts/implement_pairing_ui_and_ble_search_logs.py"
      - ".github/workflows/04_pairing_ui_and_ble_search_logs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pairing-ui-and-ble-search-logs
  cancel-in-progress: true

jobs:
  implement-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/existing-wifi-reuse-first-pairing
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Apply logging source changes
        shell: bash
        run: |
          python3 -m py_compile scripts/implement_pairing_ui_and_ble_search_logs.py
          python3 scripts/implement_pairing_ui_and_ble_search_logs.py
          grep -R "\[UI进度\]" -n app/src/main/java/com/espressif/utils/ProvisioningLog.java
          grep -R "BLE搜索结果" -n app/src/main/java/com/espressif/ui/activities/BLEProvisionLanding.java
          grep -R "已绑定BLE搜索结果" -n app/src/main/java/com/espressif/ble/BleLocalControlManager.kt
          grep -R "已绑定重配网" -n app/src/main/java/com/espressif/ui/activities/BleWifiProvisionActivity.java

      - name: Create CI build properties
        shell: bash
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          appName=ESP RainMaker Pairing Log Test
          transport=Both
          security=2
          security2Username=wifiprov
          security2UsernameThread=threadprov
          deviceNamePrefix=PROV_
          wifiScanSource=Device
          isChinaRegion=false
          isLocalControlSupported=true
          isScheduleSupported=true
          isSceneSupported=true
          isNodeGroupingSupported=true
          isNodeSharingSupported=true
          isAutomationSupported=true
          isOtaSupported=false
          isMatterSupported=false
          isCommandResponseSupported=false
          EOF

          if [ ! -f app/google-services.json ] && [ -f app/google-services.json.template ]; then
            cp app/google-services.json.template app/google-services.json
          fi

      - name: Verify logging coverage and privacy boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('app/src/main/java/com/espressif/utils/ProvisioningLog.java').read_text(encoding='utf-8')
          ble = Path('app/src/main/java/com/espressif/ui/activities/BLEProvisionLanding.java').read_text(encoding='utf-8')
          bound = Path('app/src/main/java/com/espressif/ble/BleLocalControlManager.kt').read_text(encoding='utf-8')
          reprov = Path('app/src/main/java/com/espressif/ui/activities/BleWifiProvisionActivity.java').read_text(encoding='utf-8')
          claim = Path('app/src/main/java/com/espressif/ui/activities/ClaimingActivity.java').read_text(encoding='utf-8')
          prov = Path('app/src/main/java/com/espressif/ui/activities/ProvisionActivity.java').read_text(encoding='utf-8')
          assert 'public static void uiProgress(String tag, String state, CharSequence text)' in log
          assert 'password|passphrase|passwd|pwd|pop|' in log
          assert 'rssi=' in ble and 'serviceUuids=' in ble and 'duplicate=' in ble
          assert 'matchedNodes=' in bound and '[已绑定设备]' in bound
          assert '已绑定重配网 3/3' in reprov
          assert 'Claim 5/5' in claim
          assert '密码已隐藏' in prov
          assert 'getSharedPreferences(' not in log
          assert 'FileOutputStream(' not in log
          assert 'MAX_LINES = 3000' in log
          print('Coverage/privacy checks passed')
          PY

      - name: Build debug APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Commit product source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/espressif/utils/ProvisioningLog.java \
            app/src/main/java/com/espressif/ui/activities/BLEProvisionLanding.java \
            app/src/main/java/com/espressif/ui/activities/ProofOfPossessionActivity.java \
            app/src/main/java/com/espressif/ui/activities/ClaimingActivity.java \
            app/src/main/java/com/espressif/utils/ExistingWifiReuseHelper.java \
            app/src/main/java/com/espressif/ui/activities/WiFiScanActivity.java \
            app/src/main/java/com/espressif/ui/activities/WiFiConfigActivity.java \
            app/src/main/java/com/espressif/ui/activities/ProvisionActivity.java \
            app/src/main/java/com/espressif/ble/BleLocalControlManager.kt \
            app/src/main/java/com/espressif/ui/activities/EspMainActivity.java \
            app/src/main/java/com/espressif/ui/activities/BleWifiProvisionActivity.java

          if git diff --cached --quiet; then
            echo "No product source changes to commit"
          else
            git commit -m "功能：日志记录配对通知进度和BLE搜索结果"
            git push origin HEAD:codex/existing-wifi-reuse-first-pairing
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pairing-ui-ble-search-logs-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
